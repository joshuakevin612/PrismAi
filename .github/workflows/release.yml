name: Local release candidate
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, for example 1.0.0-rc.1
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --require-hashes -r requirements-bootstrap.lock
      - run: python -m pip install --require-hashes -r requirements.lock -r requirements-tools.lock
      - run: npm ci --prefix frontend
      - run: docker build -t prism-sandbox:local sandbox
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr fonts-dejavu-core
      - run: python scripts/check.py --docker --ocr --security
      - name: Scan the exact sandbox being packaged
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/grype@sha256:621d56d1d68106b787022c81546f7e0a36202a25d1239f0c20195fab8c16f7ea prism-sandbox:local --fail-on high --only-fixed
      - name: Build and verify immutable local artifact
        run: |
          python scripts/release.py pack --version "$RELEASE_VERSION" --output ".prism/dist/prism-$RELEASE_VERSION.zip"
          python scripts/release.py verify ".prism/dist/prism-$RELEASE_VERSION.zip"
          docker save prism-sandbox:local | gzip > ".prism/dist/prism-sandbox-$RELEASE_VERSION.tar.gz"
          cd .prism/dist
          sha256sum *.zip *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prism-local-release
          path: .prism/dist/
          retention-days: 30
